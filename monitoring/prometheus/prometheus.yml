global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nook-app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
          - /etc/prometheus/targets/active/*.yml
        refresh_interval: 30s

  - job_name: nook-redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          environment: local
          application: nook-redis

  - job_name: nook-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          environment: local
          application: nook-postgres
