global:
  resolve_timeout: 5m

route:
  receiver: discord-notification
  group_by:
    - alertname
    - environment
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord-notification
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
        message: "{{ .CommonAnnotations.description }}"
