global:
  resolve_timeout: 5m

route:
  receiver: discord-prod-notification
  group_by:
    - alertname
    - environment
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - environment="dev"
      receiver: discord-dev-notification
    - matchers:
        - environment="prod"
      receiver: discord-prod-notification

receivers:
  - name: discord-dev-notification
    discord_configs:
      - webhook_url_file: /run/secrets/discord_dev_webhook_url
        send_resolved: true
        title: "[DEV {{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
        message: "{{ .CommonAnnotations.description }}"
  - name: discord-prod-notification
    discord_configs:
      - webhook_url_file: /run/secrets/discord_prod_webhook_url
        send_resolved: true
        title: "[PROD {{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
        message: "{{ .CommonAnnotations.description }}"
