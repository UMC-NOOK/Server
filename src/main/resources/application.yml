spring:
  application:
    name: nook-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

file:
  cover-upload-dir: uploads/covers
  profile-upload-dir: uploads/profiles
  cover-url-prefix: /uploads/covers/
  profile-url-prefix: /uploads/profiles/

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET}

aladin:
  base-url: ${ALADIN_BASE_URL}
  ttbkey: ${ALADIN_TTB_KEY}

logging:
  level:
    root: info
    app.nook: debug

auth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-request-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    logout-uri: https://kapi.kakao.com/v1/user/logout
    unlink-uri: https://kapi.kakao.com/v1/user/unlink
    admin-key: ${KAKAO_ADMIN_KEY}
    logout-redirect-uri: ${KAKAO_LOGOUT_REDIRECT_URI}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-request-uri: ${TOKEN_REQUEST_URI}
    user-info-uri: ${MEMBER_INFO_REQUEST_URI}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      "[spring.data.redis]": true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]":
          - 100ms
          - 300ms
          - 1s

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
