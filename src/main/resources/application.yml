spring:
  config:
    import: optional:classpath:application-secret.properties
  application:
    name: nook-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

file:
  cover-upload-dir: uploads/covers
  profile-upload-dir: uploads/profiles
  cover-url-prefix: /uploads/covers/
  profile-url-prefix: /uploads/profiles/

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET}

aladin:
  base-url: ${ALADIN_BASE_URL}
  ttbkey: ${ALADIN_TTB_KEY}

auth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-request-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    logout-uri: https://kapi.kakao.com/v1/user/logout
    unlink-uri: https://kapi.kakao.com/v1/user/unlink
    admin-key: ${KAKAO_ADMIN_KEY}
    logout-redirect-uri: ${KAKAO_LOGOUT_REDIRECT_URI}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-request-uri: ${TOKEN_REQUEST_URI}
    user-info-uri: ${MEMBER_INFO_REQUEST_URI}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      hikaricp: true
      redis: true
      http: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 300ms, 1s

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
