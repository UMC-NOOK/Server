name: Create Production Release

on:
  pull_request:
    branches:
      - production
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Generate release tag
        id: version
        shell: bash
        env:
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          set -euo pipefail
          tag="$(TZ=Asia/Seoul date -d "$MERGED_AT" +'%Y%m%d%H%M')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Same-minute merges would collide on tag name; append -2, -3, ...
          tag="$TAG"
          suffix=2
          while git rev-parse "$tag" >/dev/null 2>&1; do
            tag="${TAG}-${suffix}"
            suffix=$((suffix + 1))
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$TARGET" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --title "Release $tag" --generate-notes
