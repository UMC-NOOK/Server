name: NOOK CI

on:
  pull_request:
    branches:
      - develop-demo
      - production

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x ./gradlew ./scripts/validate-flyway-migrations.sh

      - name: Validate Flyway migrations
        run: ./scripts/validate-flyway-migrations.sh "${{ github.event.pull_request.base.sha }}"

      - name: Test, JaCoCo and RestDocs
        run: ./gradlew clean build

      - name: Upload RestDocs
        uses: actions/upload-artifact@v4
        with:
          name: restdocs
          path: build/docs/asciidoc
          if-no-files-found: warn

      - name: Report JaCoCo on pull request
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ github.token }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60

      - name: Upload JaCoCo HTML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          if-no-files-found: warn
