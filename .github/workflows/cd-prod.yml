name: NOOK PROD CD

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nook-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        run: |
          tag="prod-${GITHUB_SHA::7}"
          image="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Sync production deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_PRIVATE_KEY }}
          # Runtime state (runtime/) and secrets (/secrets) intentionally stay on the server.
          source: docker-compose.prod.yml,nginx,monitoring,grafana,scripts
          target: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Deploy prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            image="${{ steps.image.outputs.uri }}"
            registry="${image%%/*}"
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$registry"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh prod "$image"

      - name: Create Git release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.1.0"
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "Latest release tag must follow vMAJOR.MINOR.PATCH: $latest_tag" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "## PROD deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.image.outputs.uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: ${{ steps.release_tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
