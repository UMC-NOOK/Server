name: NOOK PROD CD

on:
  pull_request:
    branches:
      - production
    types:
      - closed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그 (예: prod-abcdef1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nook-server

jobs:
  promote-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout production deployment configuration
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve deploy image
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            source_tag="dev-${PR_HEAD_SHA::7}"
            prod_tag="prod-${MERGE_SHA::7}"

            digest="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$source_tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [[ -z "$digest" || "$digest" == "None" ]]; then
              echo "Dev image not found: $source_tag. Wait for DEV CD to finish before merging the release PR." >&2
              exit 1
            fi

            manifest="$(aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$digest" \
              --accepted-media-types application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageManifest' \
              --output text)"

            aws ecr put-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag "$prod_tag" \
              --image-manifest "$manifest" >/dev/null
          else
            source_tag="$INPUT_IMAGE_TAG"
            if [[ ! "$source_tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid image tag: $source_tag" >&2
              exit 1
            fi

            digest="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$source_tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [[ -z "$digest" || "$digest" == "None" ]]; then
              echo "ECR image not found: $source_tag" >&2
              exit 1
            fi

            prod_tag="$source_tag"
          fi

          image="$REGISTRY/$ECR_REPOSITORY@$digest"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "prod_tag=$prod_tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Sync production deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.DEV_PRIVATE_KEY }}
          # Runtime state (runtime/) and secrets (/secrets) intentionally stay on the server.
          source: docker-compose.prod.yml,nginx,monitoring,grafana,scripts
          target: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Deploy prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.DEV_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            image="${{ steps.image.outputs.uri }}"
            registry="${image%%/*}"
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$registry"
            chmod +x scripts/*.sh
            SECRET_DIR="$HOME/secrets" ./scripts/deploy.sh prod "$image"

      - name: Deployment summary
        run: |
          echo "## PROD deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source tag: ${{ steps.image.outputs.source_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promoted tag: ${{ steps.image.outputs.prod_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
