services:
  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_DISCORD_WEBHOOK_FILE:-/secrets/alertmanager-discord-webhook}:/run/secrets/discord_webhook_url:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - monitoring-network

  loki:
    image: grafana/loki:3.7.3
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:13.1.0
    env_file:
      - ${ENV_FILE:-/secrets/.env.monitoring}
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - monitoring-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDRESS:-redis://host.docker.internal:6379}
      REDIS_EXPORTER_REDACT_CONFIG_METRICS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    command:
      - --config.file=/dev/null
      - --collector.long_running_transactions
      - --collector.stat_statements
      - --collector.stat_statements.limit=50
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:-host.docker.internal:5432/nookDB?sslmode=disable}
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-nook}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-nook1234}
      PG_EXPORTER_COLLECTION_TIMEOUT: ${POSTGRES_EXPORTER_COLLECTION_TIMEOUT:-10s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring-network

  k6:
    image: grafana/k6:2.1.0
    profiles:
      - loadtest
    user: ${K6_DOCKER_USER:-12345:12345}
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-}
      TOKEN: ${TOKEN:-}
      K6_ACCESS_TOKEN: ${K6_ACCESS_TOKEN:-}
      K6_REFRESH_TOKEN: ${K6_REFRESH_TOKEN:-}
      K6_USER_EMAIL: ${K6_USER_EMAIL:-}
      K6_USER_NICKNAME: ${K6_USER_NICKNAME:-}
      K6_ENV: ${K6_ENV:-local}
      RUN_PREFIX: ${RUN_PREFIX:-}
      RUN_ID: ${RUN_ID:-}
      K6_REPORT_NAME: ${K6_REPORT_NAME:-}
      K6_REQUIRE_CONFIRM: ${K6_REQUIRE_CONFIRM:-}
      K6_PROD_BASE_URL_PATTERN: ${K6_PROD_BASE_URL_PATTERN:-}
      CONFIRM_PROD_LOADTEST: ${CONFIRM_PROD_LOADTEST:-}
      VUS: ${VUS:-}
      ITERATIONS: ${ITERATIONS:-}
      MAX_DURATION: ${MAX_DURATION:-}
      P95_THRESHOLD_MS: ${P95_THRESHOLD_MS:-}
      FAILED_RATE_THRESHOLD: ${FAILED_RATE_THRESHOLD:-}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,min,max
    volumes:
      - ./performance/k6:/workspace/performance/k6:ro
      - ./performance/k6/reports:/workspace/performance/k6/reports
    working_dir: /workspace
    entrypoint:
      - /bin/sh
      - /workspace/performance/k6/scripts/k6-entrypoint.sh
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - ${K6_SCRIPT:-performance/k6/scenarios/smoke.js}
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:

networks:
  monitoring-network:
