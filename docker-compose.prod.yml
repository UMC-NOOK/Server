x-app-common: &app-common
  image: ${IMAGE:?IMAGE must be set}
  env_file:
    - ${ENV_FILE:-/secrets/.env.prod}
  expose:
    - "8080"
    - "9091"
  environment:
    SPRING_PROFILES_ACTIVE: prod
    SERVER_PORT: 8080
    MANAGEMENT_SERVER_PORT: 9091
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent http://localhost:9091/actuator/health >/dev/null || exit 1"]
    interval: 12s
    timeout: 5s
    retries: 10
    start_period: 40s
  restart: unless-stopped
  networks:
    - app-network
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:1.31.3-alpine
    ports:
      - "80:80"
      - "443:443"
      - "9091:9091"
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/conf.d/active.conf:/etc/nginx/conf.d/active.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    command:
      - /bin/sh
      - -c
      - |
        awk '
          {
            gsub(/\$\{SERVER_NAME\}/, ENVIRON["SERVER_NAME"])
            print
          }
        ' /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
        (while sleep 21600; do nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    networks:
      - app-network
    logging: *default-logging

  app-blue:
    <<: *app-common

  app-green:
    <<: *app-common

  certbot:
    image: certbot/certbot:v5.7.0
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 43200 & wait $$!
        done
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_REDACT_CONFIG_METRICS: "true"
    ports:
      - "${REDIS_EXPORTER_BIND_ADDRESS:-0.0.0.0}:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.17.0
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV must be set}
      INSTANCE_NAME: ${INSTANCE_NAME:?INSTANCE_NAME must be set}
      LOKI_URL: ${LOKI_URL:?LOKI_URL must be set}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - app-blue
    restart: unless-stopped
    networks:
      - app-network
    logging: *default-logging

volumes:
  redis-data:
  alloy-data:

networks:
  app-network:
